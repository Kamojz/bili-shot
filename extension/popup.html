<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>B站快捷截图</title>
    <style>
      :root {
        --pink: #fb7299;
        --pink-dark: #e05c82;
        --blue: #00a1d6;
        --line: #ebedf0;
        --muted: #8a919c;
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        color: #1f2329;
        background: #fff;
      }
      .hd { display: flex; align-items: center; gap: 10px; }
      .hd img { width: 32px; height: 32px; border-radius: 9px; }
      .hd h1 { margin: 0; font-size: 14px; }
      .hd p { margin: 1px 0 0; font-size: 11px; color: var(--muted); }

      .status {
        display: flex; align-items: center; gap: 7px;
        margin: 12px 0; padding: 8px 10px;
        border-radius: 9px; background: #f7f8fa; font-size: 12px;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #c9ced6; flex: 0 0 auto; }
      .status.ok { background: #f0fbf4; color: #16794a; }
      .status.ok .dot { background: #17b26a; box-shadow: 0 0 0 3px rgba(23,178,106,.16); }
      .status.warn { background: #fff8ec; color: #8a5a12; }
      .status.warn .dot { background: #f5a524; }

      .keys { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 12px; }
      .keys div { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; font-size: 12px; }
      .keys div + div { border-top: 1px solid var(--line); }
      .keys span:last-child { color: var(--muted); }
      kbd {
        display: inline-block; padding: 0 6px; border-radius: 4px;
        border: 1px solid #d7dbe0; border-bottom-width: 2px; background: #fff;
        font-family: ui-monospace, Consolas, monospace; font-size: 11px;
      }

      .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; }
      .field + .field { border-top: 1px dashed var(--line); }
      .field label { color: #3b4149; font-size: 12px; }
      select {
        font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 7px;
        border: 1px solid var(--line); background: #fff; color: inherit; max-width: 176px;
      }
      select:focus { outline: 2px solid rgba(0,161,214,.35); border-color: var(--blue); }

      .actions { display: flex; gap: 8px; margin-top: 12px; }
      button {
        font: inherit; font-size: 12px; cursor: pointer; border-radius: 8px;
        border: 1px solid var(--line); background: #fff; color: #1f2329; padding: 8px 0;
        flex: 1 1 auto; transition: .15s;
      }
      button:hover { border-color: #c9ced6; background: #fbfcfd; }
      button.primary { background: var(--pink); border-color: var(--pink); color: #fff; }
      button.primary:hover { background: var(--pink-dark); border-color: var(--pink-dark); }
      button:disabled { opacity: .5; cursor: not-allowed; }

      .tip { margin: 10px 0 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
      .tip b { color: #4a5058; }
    </style>
  </head>
  <body>
    <div class="hd">
      <img src="icons/icon48.png" alt="BiliShot" />
      <div>
        <h1>B站快捷截图</h1>
        <p>按 Insert 一键截图</p>
      </div>
    </div>

    <div class="status" id="status">
      <span class="dot"></span>
      <span id="statusText">正在检测当前页面…</span>
    </div>

    <div class="keys">
      <div><span><kbd id="kbdBase">Insert</kbd></span><span>默认模式</span></div>
      <div><span><kbd>Shift</kbd> + <kbd id="kbdShift">Insert</kbd></span><span>只截视频画面</span></div>
      <div><span><kbd>Alt</kbd> + <kbd id="kbdAlt">Insert</kbd></span><span>框选区域</span></div>
    </div>

    <div class="field">
      <label for="defaultMode">默认截图范围</label>
      <select id="defaultMode">
        <option value="view">整页可见区域</option>
        <option value="video">仅视频画面</option>
        <option value="region">框选区域</option>
      </select>
    </div>
    <div class="field">
      <label for="saveAction">截图后</label>
      <select id="saveAction">
        <option value="clipboard">复制到剪贴板</option>
        <option value="download">保存到下载目录</option>
        <option value="both">两者都要</option>
      </select>
    </div>
    <div class="field">
      <label for="enabled">在 B站 启用 Ins 键</label>
      <select id="enabled">
        <option value="true">开启</option>
        <option value="false">关闭</option>
      </select>
    </div>

    <div class="actions">
      <button class="primary" id="captureBtn">立即截取当前页面</button>
      <button id="optionsBtn">设置</button>
    </div>

    <p class="tip">
      备用快捷键 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>X</kbd> 可在任意网页截图（在
      <b>chrome://extensions/shortcuts</b> 可改键）。
    </p>

    <script src="popup.js"></script>
  </body>
</html>
